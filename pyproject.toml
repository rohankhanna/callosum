[project]
name = "callosum"
version = "0.1.0"
description = "Local adaptive OpenAI-compatible router across multiple model backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx[http2]>=0.27",
    "pydantic>=2.6",
    "argon2-cffi>=23.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Real embedding providers. Skip when using the noop provider — keeps
# the proxy installable without dragging in torch / huggingface stacks
# (multi-GB). Install with `pip install -e '.[embeddings]'`.
embeddings = [
    "sentence-transformers>=3.0",
]

[project.scripts]
# Unified `callosum` CLI: server + admin in one entry point.
# `callosum serve` starts the proxy daemon; `callosum status` / routing /
# denylist / autonomy / etc. administer a running instance. Bare
# `callosum` prints the full help surface and exits non-zero.
callosum = "callosum.cli:main"
# `callosum-ctl` retained as a backwards-compat alias for the same
# unified CLI. The cron wrappers and operator muscle memory built
# around `callosum-ctl <subcommand>` continue to work; remove the
# alias once those callers have migrated.
callosum-ctl = "callosum.cli:main"
callosum-dev-loop = "callosum.dev_loop.cli:main"
callosum-embed-backfill = "callosum.jobs.embed_backfill:main"
callosum-apply-failure-labels = "callosum.jobs.apply_failure_labels:main"
callosum-recover-prompt-text = "callosum.jobs.recover_prompt_text:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callosum"]

[tool.ruff]
# 120 is a deliberate widening from the original 100: most overruns
# in this codebase are 101-115 chars (small) and forcing artificial
# wraps on those harms readability of dense list comprehensions and
# multi-arg call sites more than it helps. 120 matches widely-used
# defaults (Google, Meta style guides, ruff's own community projects)
# while still flagging genuinely-too-long lines. Files that still
# exceed 120 are wrapped explicitly.
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Test files often pin entire SSE blobs or response-payload JSON
# literals on a single line so the test data exactly matches what an
# upstream model would send on the wire. Wrapping these obscures the
# fixture's intent without making them more readable. Allow long
# lines in tests; production source still has to stay under 100.
"tests/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["callosum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
