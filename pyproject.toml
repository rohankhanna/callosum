[project]
name = "callosum"
version = "0.1.0"
description = "Local adaptive OpenAI-compatible router across multiple model backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx[http2]>=0.27",
    "pydantic>=2.6",
    "argon2-cffi>=23.1",
]

[project.scripts]
# Primary entry point under the new name.
callosum = "callosum.__main__:main"
# Backward-compat alias kept during the rename so the existing systemd
# unit (`system-dependency-codex-proxy.service`, which execs
# `uv run codex-proxy`) continues to work between Phase 1 and Phase 3.
# Drop this once Phase 3 cuts the service unit over to `callosum`.
codex-proxy = "callosum.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callosum"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["callosum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
