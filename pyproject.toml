[project]
name = "callosum"
version = "0.1.0"
description = "Local adaptive OpenAI-compatible router across multiple model backends."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx[http2]>=0.27",
    "pydantic>=2.6",
    "argon2-cffi>=23.1",
    "numpy>=1.26",
]

[project.optional-dependencies]
# Real embedding providers. Skip when using the noop provider — keeps
# the proxy installable without dragging in torch / huggingface stacks
# (multi-GB). Install with `pip install -e '.[embeddings]'`.
embeddings = [
    "sentence-transformers>=3.0",
]

[project.scripts]
callosum = "callosum.__main__:main"
callosum-ctl = "callosum.cli:main"
callosum-embed-backfill = "callosum.jobs.embed_backfill:main"
callosum-apply-failure-labels = "callosum.jobs.apply_failure_labels:main"
callosum-recover-prompt-text = "callosum.jobs.recover_prompt_text:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callosum"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["callosum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
